<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Illustration of a highway flooded up to car windows, with road signs in another language in the background">
  <title>Illustration of a highway flooded up to car windows, with road signs in another language in the background</title>
  <defs>
    <linearGradient id="fp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4a5a"/>
      <stop offset="0.7" stop-color="#8d99a8"/>
      <stop offset="1" stop-color="#a9b4c0"/>
    </linearGradient>
    <linearGradient id="fp-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b7657"/>
      <stop offset="0.45" stop-color="#6c5b43"/>
      <stop offset="1" stop-color="#3a3329"/>
    </linearGradient>
    <linearGradient id="fp-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb4c7"/>
      <stop offset="1" stop-color="#3b4b5c"/>
    </linearGradient>
    <pattern id="fp-rain" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <line x1="6" y1="0" x2="6" y2="15" stroke="#e2e8f0" stroke-opacity="0.35" stroke-width="1.2"/>
      <line x1="24" y1="18" x2="24" y2="28" stroke="#e2e8f0" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#fp-sky)"/>

  <!-- Distant skyline and trees -->
  <g fill="#6b7686">
    <rect x="0" y="128" width="46" height="52"/>
    <rect x="52" y="112" width="34" height="68"/>
    <rect x="96" y="138" width="40" height="42"/>
    <rect x="540" y="118" width="38" height="62"/>
    <rect x="584" y="134" width="56" height="46"/>
  </g>
  <path d="M136 180 q14 -26 30 -6 q14 -22 30 0 q16 -18 32 2 q12 -14 26 4 L254 180 Z M388 180 q14 -24 30 -4 q18 -24 34 0 q14 -18 30 2 q16 -20 34 2 q10 -10 18 0 L534 180 Z" fill="#56616f"/>

  <!-- Flat land at the horizon, with the road running into the distance -->
  <rect x="0" y="176" width="640" height="40" fill="#717b6c"/>
  <path d="M296 176 L344 176 L420 214 L220 214 Z" fill="#555a62"/>
  <path d="M318 178 L322 178 L326 212 L314 212 Z" fill="#d6d3c4" opacity="0.7"/>

  <!-- Overhead sign gantry -->
  <g>
    <rect x="146" y="64" width="10" height="160" fill="#5d6570"/>
    <rect x="486" y="64" width="10" height="160" fill="#5d6570"/>
    <rect x="140" y="62" width="362" height="10" fill="#6b7480"/>
    <rect x="186" y="80" width="148" height="62" rx="4" fill="#1f6f43" stroke="#f1f5f9" stroke-width="2.5"/>
    <text x="260" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1">AUSFAHRT 14</text>
    <path d="M232 120 h40 v-6 l12 10 l-12 10 v-6 h-40 z" fill="#ffffff"/>
    <rect x="348" y="80" width="126" height="62" rx="4" fill="#1f6f43" stroke="#f1f5f9" stroke-width="2.5"/>
    <text x="411" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1">ZENTRUM</text>
    <text x="411" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">↑ 12 km</text>
  </g>

  <!-- Floodwater -->
  <path d="M0 214 Q40 206 80 214 T160 214 T240 213 T320 214 T400 213 T480 214 T560 213 T640 214 L640 360 L0 360 Z" fill="url(#fp-water)"/>
  <g stroke="#c8b694" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M30 236 q30 -6 60 0"/>
    <path d="M250 232 q40 -6 80 0"/>
    <path d="M470 240 q34 -6 68 0"/>
    <path d="M60 300 q50 -8 100 0"/>
    <path d="M330 292 q60 -8 120 0"/>
    <path d="M520 318 q40 -6 80 0"/>
  </g>

  <!-- Guardrail posts poking out of the water -->
  <g fill="#9aa1a9">
    <rect x="18" y="222" width="6" height="18"/>
    <rect x="70" y="222" width="6" height="18"/>
    <rect x="122" y="222" width="6" height="18"/>
    <rect x="14" y="222" width="120" height="5"/>
  </g>

  <!-- Car 1 (red), submerged to the windows -->
  <g>
    <path d="M70 262 L92 232 Q98 226 108 226 L182 226 Q192 226 198 232 L222 262 Z" fill="#b23b34"/>
    <path d="M98 258 L110 236 L146 236 L146 258 Z M152 258 L152 236 L186 236 L202 258 Z" fill="url(#fp-glass)"/>
    <path d="M60 262 L232 262 L232 270 L60 270 Z" fill="#8e2c27"/>
    <ellipse cx="146" cy="268" rx="104" ry="8" fill="#5a4c38" opacity="0.8"/>
  </g>

  <!-- Car 2 (white), farther away -->
  <g>
    <path d="M396 232 L410 214 Q414 210 420 210 L466 210 Q472 210 476 214 L490 232 Z" fill="#e5e7eb"/>
    <path d="M414 229 L422 217 L440 217 L440 229 Z M446 229 L446 217 L466 217 L478 229 Z" fill="url(#fp-glass)"/>
    <ellipse cx="443" cy="236" rx="60" ry="5" fill="#5a4c38" opacity="0.8"/>
  </g>

  <!-- Car 3 (blue), right edge -->
  <g>
    <path d="M500 296 L526 262 Q532 256 544 256 L622 256 Q634 256 640 262 L640 296 Z" fill="#2f5d8a"/>
    <path d="M532 292 L546 268 L584 268 L584 292 Z M590 292 L590 268 L630 268 L640 280 L640 292 Z" fill="url(#fp-glass)"/>
    <ellipse cx="580" cy="300" rx="100" ry="9" fill="#4d4131" opacity="0.85"/>
  </g>

  <!-- Rain and haze -->
  <rect width="640" height="360" fill="url(#fp-rain)"/>
  <rect width="640" height="360" fill="#cbd5e1" opacity="0.08"/>

  <g>
    <rect x="490" y="326" width="136" height="24" rx="12" fill="#0b1f4d" opacity="0.85"/>
    <text x="558" y="342" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">VerifyIT illustration</text>
  </g>
</svg>
