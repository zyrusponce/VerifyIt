<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Illustration of an official advisory graphic with the fictional Brightvale city seal and the text Class Suspension, October 20">
  <title>Illustration of an official advisory graphic with the fictional Brightvale city seal and the text "Class Suspension, Oct. 20"</title>
  <defs>
    <pattern id="cl-stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="12" height="24" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#132e6b"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#cl-bg)"/>
  <rect width="640" height="360" fill="url(#cl-stripes)"/>

  <!-- Header band -->
  <rect width="640" height="44" fill="#071433"/>
  <rect y="44" width="640" height="4" fill="#facc15"/>
  <text x="24" y="28" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#67e8f9" letter-spacing="2">CITY OF BRIGHTVALE · PUBLIC INFORMATION OFFICE</text>

  <!-- Fictional city seal -->
  <g>
    <circle cx="124" cy="188" r="80" fill="#f8fafc"/>
    <circle cx="124" cy="188" r="74" fill="none" stroke="#d4a72c" stroke-width="6"/>
    <circle cx="124" cy="188" r="58" fill="#1d3f8f"/>
    <path d="M100 214 L100 178 L112 166 L112 152 L124 140 L136 152 L136 166 L148 178 L148 214 Z" fill="#f8fafc"/>
    <rect x="118" y="194" width="12" height="20" fill="#1d3f8f"/>
    <rect x="94" y="214" width="60" height="6" fill="#d4a72c"/>
    <g fill="#facc15">
      <path d="M86 160 l3 7 l7 0 l-6 4 l2 7 l-6 -4 l-6 4 l2 -7 l-6 -4 l7 0 z"/>
      <path d="M162 160 l3 7 l7 0 l-6 4 l2 7 l-6 -4 l-6 4 l2 -7 l-6 -4 l7 0 z"/>
    </g>
  </g>
  <text x="124" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="2">CITY OF BRIGHTVALE</text>

  <!-- Advisory text -->
  <rect x="236" y="78" width="132" height="32" rx="16" fill="#facc15"/>
  <text x="302" y="100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#0b1f4d" letter-spacing="2">ADVISORY</text>
  <text x="236" y="160" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">CLASS</text>
  <text x="236" y="208" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">SUSPENSION</text>
  <text x="236" y="244" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#67e8f9">Oct. 20</text>
  <text x="236" y="272" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">All levels · Public and private schools</text>
  <!-- Storm icon and reason -->
  <g transform="translate(236 284)">
    <path d="M10 14 a8 8 0 0 1 8 -8 a10 10 0 0 1 18 4 a7 7 0 0 1 0 14 h-26 a6 6 0 0 1 0 -10 z" fill="#94a3b8"/>
    <path d="M18 26 l-4 8 h5 l-3 8 l9 -11 h-5 l3 -5 z" fill="#facc15"/>
  </g>
  <text x="282" y="304" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">Due to Tropical Storm Kalinaw</text>

  <!-- Footer -->
  <rect y="322" width="640" height="38" fill="#071433"/>
  <text x="24" y="346" font-family="Inter, Arial, sans-serif" font-size="12" fill="#e2e8f0">Full advisory: brightvalecity.gov.example/advisories</text>

  <g>
    <rect x="490" y="329" width="136" height="24" rx="12" fill="#1e3a8a" opacity="0.95"/>
    <text x="558" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">VerifyIT illustration</text>
  </g>
</svg>
