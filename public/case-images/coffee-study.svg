<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Illustration of a stock-style photo: a cup of coffee next to an open notebook">
  <title>Illustration of a stock-style photo: a cup of coffee next to an open notebook</title>
  <defs>
    <linearGradient id="cs-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98457"/>
      <stop offset="1" stop-color="#8f5e38"/>
    </linearGradient>
    <radialGradient id="cs-light" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff7e6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2b1a0f" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="cs-coffee" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#8a5a36"/>
      <stop offset="0.6" stop-color="#5e3a22"/>
      <stop offset="1" stop-color="#3f2616"/>
    </radialGradient>
    <filter id="cs-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#2b1a0f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Wooden table -->
  <rect width="640" height="360" fill="url(#cs-wood)"/>
  <g stroke="#7d5131" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M0 40 Q160 30 320 44 T640 38"/>
    <path d="M0 118 Q180 108 340 122 T640 114"/>
    <path d="M0 196 Q150 188 330 200 T640 192"/>
    <path d="M0 274 Q170 266 340 278 T640 270"/>
    <path d="M0 340 Q200 332 360 344 T640 336"/>
  </g>

  <!-- Open notebook -->
  <g transform="rotate(-6 440 180)" filter="url(#cs-shadow)">
    <rect x="290" y="64" width="150" height="220" rx="4" fill="#fbfaf6"/>
    <rect x="440" y="64" width="150" height="220" rx="4" fill="#f7f5ef"/>
    <line x1="440" y1="66" x2="440" y2="282" stroke="#d6d0c4" stroke-width="2"/>
    <line x1="312" y1="70" x2="312" y2="280" stroke="#f2a7a7" stroke-width="1.5"/>
    <g stroke="#d4dde8" stroke-width="1.2">
      <line x1="300" y1="96" x2="432" y2="96"/><line x1="300" y1="114" x2="432" y2="114"/><line x1="300" y1="132" x2="432" y2="132"/>
      <line x1="300" y1="150" x2="432" y2="150"/><line x1="300" y1="168" x2="432" y2="168"/><line x1="300" y1="186" x2="432" y2="186"/>
      <line x1="300" y1="204" x2="432" y2="204"/><line x1="300" y1="222" x2="432" y2="222"/><line x1="300" y1="240" x2="432" y2="240"/>
      <line x1="448" y1="96" x2="580" y2="96"/><line x1="448" y1="114" x2="580" y2="114"/><line x1="448" y1="132" x2="580" y2="132"/>
      <line x1="448" y1="150" x2="580" y2="150"/><line x1="448" y1="168" x2="580" y2="168"/><line x1="448" y1="186" x2="580" y2="186"/>
      <line x1="448" y1="204" x2="580" y2="204"/><line x1="448" y1="222" x2="580" y2="222"/><line x1="448" y1="240" x2="580" y2="240"/>
    </g>
    <!-- Handwriting -->
    <g stroke="#3b4a6b" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M320 92 q6 -6 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
      <path d="M320 110 q6 -6 12 0 t12 0 t12 0 t12 0 t12 0"/>
      <path d="M320 128 q6 -6 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
      <path d="M320 146 q6 -6 12 0 t12 0 t12 0"/>
      <path d="M456 92 q6 -6 12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
      <path d="M456 110 q6 -6 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
      <path d="M456 128 q6 -6 12 0 t12 0 t12 0 t12 0"/>
    </g>
    <!-- Pen -->
    <g transform="rotate(32 520 210)">
      <rect x="470" y="204" width="120" height="10" rx="5" fill="#0b1f4d"/>
      <rect x="560" y="200" width="24" height="4" rx="2" fill="#d4a72c"/>
      <path d="M470 204 L456 209 L470 214 Z" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- Coffee cup on a saucer -->
  <g filter="url(#cs-shadow)">
    <ellipse cx="160" cy="236" rx="104" ry="40" fill="#efece6"/>
    <ellipse cx="160" cy="232" rx="78" ry="28" fill="#e2ded6"/>
    <path d="M94 186 L104 238 Q160 262 216 238 L226 186 Z" fill="#f8f7f3"/>
    <path d="M222 196 q34 -4 34 18 q0 22 -38 20" fill="none" stroke="#f1efe9" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="160" cy="186" rx="66" ry="24" fill="#fbfaf7"/>
    <ellipse cx="160" cy="188" rx="56" ry="18" fill="url(#cs-coffee)"/>
    <ellipse cx="146" cy="184" rx="18" ry="5" fill="#c08a5a" opacity="0.45"/>
  </g>

  <!-- Steam -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
    <path d="M140 160 q-12 -16 0 -32 q12 -16 0 -32"/>
    <path d="M166 156 q-12 -18 0 -36 q12 -18 0 -36"/>
    <path d="M190 162 q-10 -14 0 -28 q10 -14 0 -28"/>
  </g>

  <!-- Coffee beans -->
  <g fill="#4a2c18">
    <ellipse cx="72" cy="318" rx="11" ry="7" transform="rotate(-20 72 318)"/>
    <ellipse cx="98" cy="330" rx="11" ry="7" transform="rotate(25 98 330)"/>
    <ellipse cx="250" cy="320" rx="11" ry="7" transform="rotate(10 250 320)"/>
  </g>
  <g stroke="#2b190d" stroke-width="1.5">
    <line x1="64" y1="321" x2="80" y2="315"/><line x1="91" y1="326" x2="105" y2="334"/><line x1="241" y1="319" x2="259" y2="321"/>
  </g>

  <rect width="640" height="360" fill="url(#cs-light)"/>

  <g>
    <rect x="490" y="326" width="136" height="24" rx="12" fill="#0b1f4d" opacity="0.85"/>
    <text x="558" y="342" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">VerifyIT illustration</text>
  </g>
</svg>
