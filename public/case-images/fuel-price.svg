<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Illustration of a fuel station price board showing diesel, unleaded, and premium prices per liter">
  <title>Illustration of a fuel station price board showing diesel, unleaded, and premium prices per liter</title>
  <defs>
    <linearGradient id="fu-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ef"/>
      <stop offset="1" stop-color="#e6f4fb"/>
    </linearGradient>
    <linearGradient id="fu-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b9199"/>
      <stop offset="1" stop-color="#5f656d"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#fu-sky)"/>
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="470" cy="50" rx="46" ry="14"/>
    <ellipse cx="510" cy="42" rx="34" ry="14"/>
    <ellipse cx="560" cy="74" rx="40" ry="11"/>
  </g>

  <!-- Ground -->
  <rect y="282" width="640" height="78" fill="url(#fu-ground)"/>
  <g fill="#f8fafc" opacity="0.7">
    <rect x="360" y="318" width="70" height="5" transform="skewX(-30)"/>
    <rect x="520" y="318" width="70" height="5" transform="skewX(-30)"/>
  </g>

  <!-- Station canopy and pumps -->
  <g>
    <rect x="344" y="120" width="296" height="30" fill="#ffffff"/>
    <rect x="344" y="150" width="296" height="10" fill="#ea580c"/>
    <rect x="380" y="160" width="12" height="122" fill="#d1d5db"/>
    <rect x="590" y="160" width="12" height="122" fill="#d1d5db"/>
    <rect x="440" y="214" width="40" height="68" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="448" y="224" width="24" height="14" rx="2" fill="#0f172a"/>
    <rect x="520" y="214" width="40" height="68" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="528" y="224" width="24" height="14" rx="2" fill="#0f172a"/>
    <path d="M480 236 q14 6 10 26" stroke="#111827" stroke-width="3" fill="none"/>
  </g>

  <!-- Price board -->
  <g>
    <rect x="170" y="240" width="16" height="44" fill="#64748b"/>
    <rect x="58" y="28" width="240" height="216" rx="10" fill="#111827" stroke="#334155" stroke-width="3"/>
    <rect x="58" y="28" width="240" height="46" rx="10" fill="#ea580c"/>
    <rect x="58" y="60" width="240" height="14" fill="#ea580c"/>
    <text x="178" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">BV FUEL</text>

    <text x="76" y="112" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">DIESEL</text>
    <rect x="170" y="88" width="112" height="36" rx="4" fill="#000000"/>
    <text x="226" y="115" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#fbbf24">₱54.20</text>

    <text x="76" y="164" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">UNLEADED</text>
    <rect x="170" y="140" width="112" height="36" rx="4" fill="#000000"/>
    <text x="226" y="167" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#fbbf24">₱61.85</text>

    <text x="76" y="216" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">PREMIUM</text>
    <rect x="170" y="192" width="112" height="36" rx="4" fill="#000000"/>
    <text x="226" y="219" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#fbbf24">₱66.40</text>

    <text x="178" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1.5">PER LITER</text>
  </g>

  <g>
    <rect x="490" y="326" width="136" height="24" rx="12" fill="#0b1f4d" opacity="0.85"/>
    <text x="558" y="342" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">VerifyIT illustration</text>
  </g>
</svg>
