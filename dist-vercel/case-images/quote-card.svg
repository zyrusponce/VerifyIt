<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Illustration of a shareable quote graphic with a drawn portrait of a fictional councilor and the quote in large letters">
  <title>Illustration of a shareable quote graphic with a drawn portrait of a fictional councilor and the quote in large letters</title>
  <defs>
    <linearGradient id="qc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1416"/>
      <stop offset="1" stop-color="#5b1a1d"/>
    </linearGradient>
    <linearGradient id="qc-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6066"/>
      <stop offset="1" stop-color="#3b3337"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#qc-bg)"/>

  <!-- Portrait panel (drawn, not a real person) -->
  <rect width="236" height="360" fill="url(#qc-panel)"/>
  <g>
    <path d="M20 360 Q28 270 118 254 Q208 270 216 360 Z" fill="#1f2937"/>
    <path d="M96 256 L118 300 L140 256 Z" fill="#f1f5f9"/>
    <path d="M113 270 L123 270 L127 320 L118 334 L109 320 Z" fill="#7f1d1d"/>
    <rect x="104" y="214" width="28" height="44" fill="#b9835e"/>
    <ellipse cx="118" cy="168" rx="50" ry="60" fill="#c99470"/>
    <path d="M68 160 Q66 104 118 100 Q172 102 170 160 Q160 126 118 128 Q80 128 68 160 Z" fill="#2b211d"/>
    <ellipse cx="68" cy="172" rx="8" ry="13" fill="#b9835e"/>
    <ellipse cx="168" cy="172" rx="8" ry="13" fill="#b9835e"/>
    <ellipse cx="98" cy="168" rx="5" ry="4" fill="#2b211d"/>
    <ellipse cx="138" cy="168" rx="5" ry="4" fill="#2b211d"/>
    <path d="M88 154 q10 -6 20 -2 M128 152 q10 -4 20 2" stroke="#2b211d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M118 172 q-4 16 4 20" stroke="#a8724f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M102 202 q16 6 32 0" stroke="#7a4a33" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="236" width="5" height="360" fill="#f87171"/>

  <!-- Quote -->
  <text x="268" y="112" font-family="Georgia, serif" font-size="110" font-weight="700" fill="#f87171">“</text>
  <text x="270" y="140" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff">Students who can't</text>
  <text x="270" y="176" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff">afford tuition should</text>
  <text x="270" y="212" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff">just stop studying.</text>
  <text x="270" y="256" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#fecaca">— Councilor M. Dela Rosa</text>

  <!-- Page watermark -->
  <text x="270" y="306" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#fecaca" opacity="0.75" letter-spacing="2">VOICE OF THE BRIGHTVALE PEOPLE</text>

  <g>
    <rect x="490" y="326" width="136" height="24" rx="12" fill="#0b1f4d" opacity="0.85"/>
    <text x="558" y="342" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">VerifyIT illustration</text>
  </g>
</svg>
