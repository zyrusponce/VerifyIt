<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Illustration of a still frame from a video showing a person resembling a fictional mayor speaking at a podium">
  <title>Illustration of a still frame from a video showing a person resembling a fictional mayor speaking at a podium</title>
  <defs>
    <linearGradient id="mv-stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0d2238"/>
    </linearGradient>
    <linearGradient id="mv-podium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3b28"/>
      <stop offset="1" stop-color="#2f1f15"/>
    </linearGradient>
    <pattern id="mv-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.12"/>
    </pattern>
    <filter id="mv-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#mv-stage)"/>
  <!-- Curtain folds -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="10">
    <line x1="40" y1="0" x2="40" y2="360"/><line x1="110" y1="0" x2="110" y2="360"/><line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="460" y1="0" x2="460" y2="360"/><line x1="530" y1="0" x2="530" y2="360"/><line x1="600" y1="0" x2="600" y2="360"/>
  </g>

  <!-- Flags (blurred background) -->
  <g filter="url(#mv-soft)">
    <rect x="96" y="40" width="5" height="230" fill="#c8a24a"/>
    <path d="M101 50 Q140 40 170 56 L170 150 Q140 136 101 146 Z" fill="#2563eb"/>
    <path d="M101 98 Q140 88 170 104 L170 150 Q140 136 101 146 Z" fill="#dc2626"/>
    <rect x="540" y="40" width="5" height="230" fill="#c8a24a"/>
    <path d="M540 50 Q500 40 470 56 L470 150 Q500 136 540 146 Z" fill="#e2e8f0"/>
    <path d="M540 98 Q500 88 470 104 L470 150 Q500 136 540 146 Z" fill="#16a34a"/>
  </g>

  <!-- Speaker (drawn, not a real person) -->
  <g>
    <path d="M220 360 Q226 250 320 236 Q414 250 420 360 Z" fill="#1f2937"/>
    <path d="M298 238 L320 286 L342 238 Z" fill="#f1f5f9"/>
    <path d="M315 252 L325 252 L329 300 L320 312 L311 300 Z" fill="#1d4ed8"/>
    <rect x="304" y="196" width="32" height="44" fill="#a8744f"/>
    <ellipse cx="320" cy="150" rx="44" ry="54" fill="#b9835e"/>
    <path d="M276 140 Q276 92 320 90 Q366 92 364 140 Q354 112 320 114 Q288 114 276 140 Z" fill="#1c1917"/>
    <ellipse cx="276" cy="154" rx="7" ry="12" fill="#a8744f"/>
    <ellipse cx="364" cy="154" rx="7" ry="12" fill="#a8744f"/>
    <ellipse cx="302" cy="148" rx="4.5" ry="3.5" fill="#1c1917"/>
    <ellipse cx="338" cy="148" rx="4.5" ry="3.5" fill="#1c1917"/>
    <path d="M292 136 q10 -5 20 -1 M328 135 q10 -4 20 1" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M320 152 q-4 14 4 18" stroke="#93603f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Blocky compression artifacts around the mouth -->
    <g>
      <rect x="300" y="174" width="10" height="10" fill="#c79068"/>
      <rect x="310" y="176" width="10" height="10" fill="#9f6a47"/>
      <rect x="320" y="173" width="10" height="10" fill="#d19b74"/>
      <rect x="330" y="177" width="10" height="10" fill="#a9734f"/>
      <rect x="306" y="184" width="10" height="8" fill="#b07a55"/>
      <rect x="318" y="185" width="12" height="8" fill="#6e3b2a"/>
      <rect x="330" y="184" width="8" height="8" fill="#c48b63"/>
    </g>
  </g>

  <!-- Podium and microphones -->
  <g>
    <line x1="300" y1="270" x2="292" y2="214" stroke="#111827" stroke-width="3"/>
    <line x1="340" y1="270" x2="348" y2="214" stroke="#111827" stroke-width="3"/>
    <ellipse cx="292" cy="210" rx="6" ry="8" fill="#111827"/>
    <ellipse cx="348" cy="210" rx="6" ry="8" fill="#111827"/>
    <path d="M226 268 L414 268 L400 360 L240 360 Z" fill="url(#mv-podium)"/>
    <rect x="220" y="262" width="200" height="10" rx="3" fill="#6b4630"/>
    <circle cx="320" cy="310" r="22" fill="#1d3f8f" stroke="#d4a72c" stroke-width="4"/>
    <path d="M310 320 L310 304 L316 298 L320 292 L324 298 L330 304 L330 320 Z" fill="#f8fafc"/>
  </g>

  <!-- Video overlays -->
  <rect width="640" height="360" fill="url(#mv-scan)"/>
  <g>
    <rect x="18" y="18" width="104" height="30" rx="4" fill="#dc2626"/>
    <circle cx="34" cy="33" r="5" fill="#ffffff"/>
    <text x="46" y="39" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1">LEAKED</text>
  </g>
  <g>
    <rect y="322" width="640" height="38" fill="#000000" opacity="0.65"/>
    <path d="M22 332 L22 350 L37 341 Z" fill="#ffffff"/>
    <rect x="54" y="339" width="440" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
    <rect x="54" y="339" width="150" height="4" rx="2" fill="#ef4444"/>
    <circle cx="204" cy="341" r="6" fill="#ef4444"/>
    <text x="510" y="346" font-family="Inter, Arial, sans-serif" font-size="12" fill="#ffffff">0:47 / 1:32</text>
  </g>

  <g>
    <rect x="490" y="22" width="136" height="24" rx="12" fill="#0b1f4d" opacity="0.85"/>
    <text x="558" y="38" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">VerifyIT illustration</text>
  </g>
</svg>
